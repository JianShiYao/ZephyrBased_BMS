# Release 加固覆盖层(骨架)
# 用法:west build ... -- -DEXTRA_CONF_FILE=prj_release.conf
# 叠加在 app/prj.conf 之上,面向量产/功能安全运行态:关调试设施、收紧运行时行为。
# 下列为方向示例,具体取舍随安全策略与板级补充。

# 关闭调试日志与 RTT(量产可关,减小体量、避免信息泄露)
CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n

# 体量优先优化
CONFIG_SIZE_OPTIMIZATIONS=y

# 看门狗:量产建议启用(驱动/超时按板级补充后取消注释)
# CONFIG_WATCHDOG=y
