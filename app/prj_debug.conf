# Debug 覆盖层(骨架)
# 用法:west build ... -- -DEXTRA_CONF_FILE=prj_debug.conf
# 叠加在 app/prj.conf 之上,面向开发/调试:最大化可观测性。

# 详细日志(即时模式,便于崩溃现场保留)
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=4

# 断言与线程名(便于定位)
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y

# 栈/线程分析(按需取消注释)
# CONFIG_THREAD_ANALYZER=y
